server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstream container IPs (they change when containers are recreated)
    resolver 127.0.0.11 valid=10s;
    set $upstream_skf skf-copilot;
    set $upstream_guardrail guardrail;
    set $upstream_agent agent;

    # SSE / streaming friendly defaults
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 300s;

    location /api/skf/ {
        proxy_pass http://$upstream_skf:8005;
    }

    location /api/guardrail {
        proxy_pass http://$upstream_guardrail:8003;
    }

    location /api/guardrail-events {
        proxy_pass http://$upstream_guardrail:8003;
    }

    location /api/logs {
        proxy_pass http://$upstream_guardrail:8003;
    }

    location /api/ {
        proxy_pass http://$upstream_agent:8001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
